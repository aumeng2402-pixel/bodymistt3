<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      line-height: 1.25;
    }

    /* ตารางคำสั่งซื้อ */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .orders {
      width: 100%;
      min-width: 54rem;
      border-collapse: collapse;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .orders th,
    .orders td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }
    .orders thead th {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 500;
      white-space: nowrap;
      background: var(--cream);
      border-bottom-color: var(--line-strong);
    }
    .orders tbody tr:last-child td { border-bottom: 0; }
    .orders td:first-child { white-space: nowrap; color: var(--ink-soft); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section__head">
        <h1 class="page-title">รายการสั่งซื้อ</h1>
        <p class="lead">เรียงจากรายการล่าสุดขึ้นก่อน ข้อมูลอาจใช้เวลาอัปเดตสักครู่หลังมีคำสั่งซื้อใหม่</p>
        <span class="rule"></span>
      </div>

      <div class="table-wrap">
        <table id="ordersTable" class="orders">
          <thead>
            <tr>
              <th scope="col">วันเวลา</th>
              <th scope="col">ชื่อลูกค้า</th>
              <th scope="col">เบอร์โทร/Line</th>
              <th scope="col">รายการสินค้า</th>
              <th scope="col">จำนวนเงินรวม</th>
              <th scope="col">หมายเหตุ</th>
            </tr>
          </thead>
          <!-- script.js เติมข้อมูลลงใน tbody -->
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
